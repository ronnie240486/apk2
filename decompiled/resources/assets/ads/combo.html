<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout com Banners</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            gap: 5px;
        }
        .left-side {
            width: 55%;
            display: flex;
            flex-direction: row;
            gap: 5px;
        }
        .right-side {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 5px;
        }
        .iframe-container {
            flex: 1;
            border: none;
            box-sizing: border-box;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
            background-color: transparent;
        }
        iframe * {
            background-color: transparent !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="iframe-container">
                <iframe id="adsOne"></iframe>
            </div>
            <div class="iframe-container">
                <iframe id="adsTwo"></iframe>
            </div>
        </div>
        <div class="right-side">
            <div class="iframe-container">
                <iframe id="adsThree"></iframe>
            </div>
            <div class="iframe-container">
                <iframe id="adsFour"></iframe>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('url');

        if (apiKey) {
            document.getElementById('adsOne').src = `AdsOne.html?url=${apiKey}`;
            document.getElementById('adsTwo').src = `AdsTwo.html?url=${apiKey}`;
            document.getElementById('adsThree').src = `AdsThree.html?url=${apiKey}`;
            document.getElementById('adsFour').src = `AdsFour.html?url=${apiKey}`;
        } else {
            console.warn("Nenhuma apiKey foi passada na URL.");
        }
    </script>
</body>
</html>
