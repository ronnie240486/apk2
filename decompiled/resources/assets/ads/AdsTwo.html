<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slide de Séries em Alta</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: transparent;
            user-select: none; /* Impede seleção de texto */
            pointer-events: none; /* Bloqueia interações do usuário */
            position: relative;
            touch-action: none; /* Bloqueia gestos de toque */
        }
        
        #slider-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .active {
            opacity: 1;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 70%;
            max-height: 50%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.7));
        }

        /* Faixa preta inferior sobreposta ao slider */
        .footer-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.3), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10; /* Garante que está sobreposta ao slider */
        }

        .footer-banner p {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="slider-container">
        <div id="slide1" class="slide active">
            <img id="logo1" class="logo" src="" alt="">
        </div>
        <div id="slide2" class="slide">
            <img id="logo2" class="logo" src="" alt="">
        </div>
    </div>

    <!-- Faixa preta sobreposta -->
    <div class="footer-banner">
        <p>SÉRIES SUGERIDAS</p>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const apiKey = urlParams.get('url');
    const language = 'pt-BR';
    let currentIndex = 0;
    let series = [];
    let currentSlide = document.getElementById('slide1');
    let nextSlide = document.getElementById('slide2');

    async function fetchTrendingSeries() {
        try {
            const response = await fetch(`https://api.themoviedb.org/3/trending/tv/week?api_key=${apiKey}&language=${language}`);
            if (!response.ok) throw new Error('Falha ao buscar séries em alta');

            const data = await response.json();

            // Pega até 15 séries com poster_path válido
            series = data.results.filter(serie => serie.poster_path).slice(0, 15);

            if (series.length === 0) {
                console.error("Nenhuma série com poster_path disponível.");
                return;
            }

            updateSlide(true);
            setInterval(() => updateSlide(), 9000);
        } catch (error) {
            console.error('Erro ao buscar séries em alta:', error);
        }
    }

    function updateSlide(firstLoad = false) {
        if (series.length === 0) return;
        const serie = series[currentIndex];

        const bgImage = `https://image.tmdb.org/t/p/w500${serie.poster_path}`;
        nextSlide.style.backgroundImage = `url(${bgImage})`;

        if (firstLoad) {
            nextSlide.classList.add('active');
            currentSlide.classList.remove('active');
            [currentSlide, nextSlide] = [nextSlide, currentSlide];
            currentIndex = (currentIndex + 1) % series.length;
            return;
        }

        nextSlide.classList.add('active');
        setTimeout(() => {
            currentSlide.classList.remove('active');
            [currentSlide, nextSlide] = [nextSlide, currentSlide];
            currentIndex = (currentIndex + 1) % series.length;
        }, 1000);
    }

    fetchTrendingSeries();

    // Impede interações do usuário
    document.addEventListener('keydown', (event) => event.preventDefault());
    document.addEventListener('contextmenu', (event) => event.preventDefault());
    document.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
    document.addEventListener('gesturestart', (event) => event.preventDefault());
    document.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
</script>
</body>
</html>
