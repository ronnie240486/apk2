<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Slide de Conteúdo Infantil</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap'); /* Fonte divertida */

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: transparent;
            user-select: none; /* Impede seleção de texto */
            pointer-events: none; /* Bloqueia interações do usuário */
            position: relative;
            touch-action: none; /* Bloqueia gestos de toque */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #slider-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .active {
            opacity: 1;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 60%;
            max-height: 60%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.7));
        }

        /* Faixa preta padrão */
        .footer-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.3), transparent);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 40px;
            z-index: 10; /* Garante que está sobreposta ao slider */
        }

        .footer-banner p {
            font-size: 36px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'Fredoka One', cursive; /* Fonte divertida */
            margin: 0;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(45deg, #ff0000, #ff9900, #33cc33, #0099ff, #9900cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="slider-container">
        <div id="slide1" class="slide active">
            <img id="logo1" class="logo" src="" alt="">
        </div>
        <div id="slide2" class="slide">
            <img id="logo2" class="logo" src="" alt="">
        </div>
    </div>

    <!-- Faixa preta padrão com "KIDS" colorido -->
    <div class="footer-banner">
        <p>KIDS</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('url');
        const language = 'pt-BR';
        let currentIndex = 0;
        let infantis = [];
        let currentSlide = document.getElementById('slide1');
        let nextSlide = document.getElementById('slide2');
        let currentLogo = document.getElementById('logo1');
        let nextLogo = document.getElementById('logo2');

        async function fetchTrendingInfantil() {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${apiKey}&language=${language}&with_genres=16&sort_by=popularity.desc`);
                if (!response.ok) {
                    throw new Error('Falha ao buscar conteúdos infantis em alta');
                }
                const data = await response.json();

                // Filtra apenas conteúdos infantis que possuem logo disponível
                const filteredInfantis = [];
                for (let infantil of data.results) {
                    const logoImage = await getInfantilLogo(infantil.id);
                    if (logoImage) {
                        filteredInfantis.push({ ...infantil, logo: logoImage });
                    }
                    if (filteredInfantis.length >= 15) break; // Obtém até 15 conteúdos infantis com logo
                }

                if (filteredInfantis.length === 0) {
                    console.error("Nenhum conteúdo infantil com logo disponível encontrado.");
                    return;
                }

                infantis = filteredInfantis;
                updateSlide(true);
                setInterval(() => updateSlide(), 11000); // Troca automática a cada 11s
            } catch (error) {
                console.error('Erro ao buscar conteúdos infantis:', error);
            }
        }

        async function getInfantilLogo(infantilId) {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/tv/${infantilId}/images?api_key=${apiKey}`);
                const data = await response.json();
                const logos = data.logos.filter(img => img.iso_639_1 === "pt"); // Busca logos em português
                return logos.length > 0 ? `https://image.tmdb.org/t/p/w500${logos[0].file_path}` : null;
            } catch (error) {
                console.error('Erro ao buscar a logo do conteúdo infantil:', error);
                return null;
            }
        }

        function updateSlide(firstLoad = false) {
            if (infantis.length === 0) return;
            const infantil = infantis[currentIndex];

            // Obtém a imagem de fundo em qualidade reduzida (w780)
            const bgImage = `https://image.tmdb.org/t/p/w780${infantil.backdrop_path}`;
            nextSlide.style.backgroundImage = `url(${bgImage})`;

            // Exibe a logo
            nextLogo.src = infantil.logo;
            nextLogo.style.display = 'block';

            if (firstLoad) {
                nextSlide.classList.add('active');
                currentSlide.classList.remove('active');
                [currentSlide, nextSlide] = [nextSlide, currentSlide]; // Troca os papéis dos slides
                [currentLogo, nextLogo] = [nextLogo, currentLogo]; // Troca as logos
                return;
            }

            // Faz a transição da imagem
            nextSlide.classList.add('active');
            setTimeout(() => {
                currentSlide.classList.remove('active');
                [currentSlide, nextSlide] = [nextSlide, currentSlide]; // Troca os papéis dos slides
                [currentLogo, nextLogo] = [nextLogo, currentLogo]; // Troca as logos
                currentIndex = (currentIndex + 1) % infantis.length; // Passa para o próximo conteúdo
            }, 1000);
        }

        fetchTrendingInfantil();
    </script>
</body>
</html>
