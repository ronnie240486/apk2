<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Slide de Novelas Brasileiras</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: transparent;
            user-select: none;
            pointer-events: none;
            position: relative;
            touch-action: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #slider-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .active {
            opacity: 1;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 60%;
            max-height: 60%;
            object-fit: contain;
            filter: drop-shadow(2px 2px 5px rgba(0, 0, 0, 0.7));
        }

        .footer-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.3), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .footer-banner p {
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="slider-container">
        <div id="slide1" class="slide active">
            <img id="logo1" class="logo" src="" alt="">
        </div>
        <div id="slide2" class="slide">
            <img id="logo2" class="logo" src="" alt="">
        </div>
    </div>

    <div class="footer-banner">
        <p>NOVELAS SUGERIDAS</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const apiKey = urlParams.get('url');
        const language = 'pt-BR';
        let currentIndex = 0;
        let novelas = [];
        let currentSlide = document.getElementById('slide1');
        let nextSlide = document.getElementById('slide2');
        let currentLogo = document.getElementById('logo1');
        let nextLogo = document.getElementById('logo2');

        async function fetchTrendingNovelas() {
            try {
                // Adiciona o parâmetro with_origin_country=BR para filtrar novelas brasileiras
                const response = await fetch(`https://api.themoviedb.org/3/discover/tv?api_key=${apiKey}&language=${language}&with_genres=10766&with_origin_country=BR&sort_by=popularity.desc`);
                if (!response.ok) {
                    throw new Error('Falha ao buscar novelas brasileiras');
                }
                const data = await response.json();

                // Filtra apenas novelas que possuem logo disponível
                const filteredNovelas = [];
                for (let novela of data.results) {
                    const logoImage = await getNovelaLogo(novela.id);
                    if (logoImage) {
                        filteredNovelas.push({ ...novela, logo: logoImage });
                    }
                    if (filteredNovelas.length >= 15) break; // Obtém até 15 novelas com logo
                }

                if (filteredNovelas.length === 0) {
                    console.error("Nenhuma novela brasileira com logo disponível encontrada.");
                    return;
                }

                novelas = filteredNovelas;
                updateSlide(true);
                setInterval(() => updateSlide(), 10000);
            } catch (error) {
                console.error('Erro ao buscar novelas brasileiras:', error);
            }
        }

        async function getNovelaLogo(novelaId) {
            try {
                const response = await fetch(`https://api.themoviedb.org/3/tv/${novelaId}/images?api_key=${apiKey}`);
                const data = await response.json();
                const logos = data.logos.filter(img => img.iso_639_1 === "pt"); // Busca logos em português
                return logos.length > 0 ? `https://image.tmdb.org/t/p/w500${logos[0].file_path}` : null;
            } catch (error) {
                console.error('Erro ao buscar a logo da novela:', error);
                return null;
            }
        }

        function updateSlide(firstLoad = false) {
            if (novelas.length === 0) return;
            const novela = novelas[currentIndex];

            const bgImage = `https://image.tmdb.org/t/p/w780${novela.backdrop_path}`;
            nextSlide.style.backgroundImage = `url(${bgImage})`;

            nextLogo.src = novela.logo;
            nextLogo.style.display = 'block';

            if (firstLoad) {
                nextSlide.classList.add('active');
                currentSlide.classList.remove('active');
                [currentSlide, nextSlide] = [nextSlide, currentSlide];
                [currentLogo, nextLogo] = [nextLogo, currentLogo];
                return;
            }

            nextSlide.classList.add('active');
            setTimeout(() => {
                currentSlide.classList.remove('active');
                [currentSlide, nextSlide] = [nextSlide, currentSlide];
                [currentLogo, nextLogo] = [nextLogo, currentLogo];
                currentIndex = (currentIndex + 1) % novelas.length;
            }, 1000);
        }

        fetchTrendingNovelas();

        // Impede interações do usuário
        document.addEventListener('keydown', (event) => event.preventDefault());
        document.addEventListener('contextmenu', (event) => event.preventDefault());
        document.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', (event) => event.preventDefault());
        document.addEventListener('wheel', (event) => event.preventDefault(), { passive: false });
    </script>
</body>
</html>
